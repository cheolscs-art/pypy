<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬라이드쇼</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
        cursor: none;
    }
    #container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
    }
    .slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.9s ease;
        background: #000;
    }
    .slide.active {
        opacity: 1;
        z-index: 2;
    }
    #fadeOverlay {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 50;
        transition: opacity 2s ease;
    }
    /* 음악 재생 안내 */
    #musicGuide {
        position: absolute;
        bottom: 40px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255,255,255,0.85);
        font-size: 20px;
        font-weight: 600;
        z-index: 30;
        text-shadow: 0 0 8px #000;
        display: none;
        pointer-events: none;
    }
</style>
</head>
<body>
<div id="container">
    <div id="fadeOverlay"></div>
    <div id="musicGuide">화면을 클릭하면 음악이 재생됩니다</div>
</div>

<audio id="bgm" src="./bgm.mp3" loop></audio>

<script>
// ========================================== 
// ★ 여기만 수정
// ==========================================
const IMAGE_LIST = [
    "001.jpg",
    "002.jpg",
    "003.jpg",
    "004.jpg",
    "005.jpg",
    "006.jpg",
    "007.jpg",
    "008.jpg",
    "009.jpg",
    "0010.jpg",
    "0011.jpg",
    "0012.jpg",
    "0013.jpg",
    "0014.jpg",
    "0015.jpg",
    "0016.jpg",
    "0017.jpg",
    "0018.jpg",
    "0019.jpg",
    "0020.jpg",
    "0021.jpg",
    "0022.jpg",
    "0023.jpg",
    "0024.jpg",
    "0025.jpg",
    "0026.jpg",
    "0027.jpg",
    "0028.jpg",
    "0029.jpg",
    "0030.jpg",
    "0031.jpg",
    "0032.jpg",
        // 사진 파일 이름 추가
];

const MUSIC_FILE = "bgm.mp3";   // ← 실제 파일 이름과 대소문자까지 정확히 맞추세요
const SLIDE_TIME = 3500;

// ==========================================
const container = document.getElementById('container');
const overlay   = document.getElementById('fadeOverlay');
const bgm       = document.getElementById('bgm');
const musicGuide = document.getElementById('musicGuide');

let slides = [];
let current = 0;
let timer = null;
let isEnding = false;
let musicStarted = false;

function start() {
    if (IMAGE_LIST.length === 0) {
        alert("IMAGE_LIST에 사진 파일 이름을 추가해주세요.");
        return;
    }

    // 이미지 생성
    IMAGE_LIST.forEach(src => {
        const img = document.createElement('img');
        img.className = 'slide';
        img.src = src;
        container.appendChild(img);
        slides.push(img);
    });
    slides[0].classList.add('active');

    // 음악 설정
    if (MUSIC_FILE) {
        bgm.src = MUSIC_FILE;
        bgm.loop = true;
        bgm.volume = 1.0;

        // 자동재생 시도
        const playPromise = bgm.play();

        if (playPromise !== undefined) {
            playPromise
                .then(() => {
                    musicStarted = true;
                    console.log("음악 재생 성공");
                })
                .catch(err => {
                    console.warn("자동재생 차단됨:", err);
                    // 안내 문구 표시
                    musicGuide.style.display = 'block';
                    document.body.style.cursor = 'pointer';

                    // 클릭하면 재생
                    const startMusic = () => {
                        bgm.play()
                            .then(() => {
                                musicStarted = true;
                                musicGuide.style.display = 'none';
                                document.body.style.cursor = 'none';
                                console.log("클릭 후 음악 재생 성공");
                            })
                            .catch(e => {
                                console.error("음악 재생 실패:", e);
                                alert("음악 파일을 찾을 수 없거나 재생할 수 없습니다.\n파일 이름과 위치를 확인해주세요.");
                            });
                        document.body.removeEventListener('click', startMusic);
                    };
                    document.body.addEventListener('click', startMusic);
                });
        }
    }

    timer = setInterval(nextSlide, SLIDE_TIME);
}

function nextSlide() {
    if (isEnding) return;

    const next = current + 1;
    if (next >= slides.length) {
        startEnding();
        return;
    }

    slides[current].classList.remove('active');
    slides[next].classList.add('active');
    current = next;
}

function startEnding() {
    isEnding = true;
    clearInterval(timer);

    // 음악 페이드아웃
    let vol = bgm.volume;
    const fadeMusic = setInterval(() => {
        vol -= 0.04;
        if (vol <= 0) {
            bgm.volume = 0;
            bgm.pause();
            clearInterval(fadeMusic);
        } else {
            bgm.volume = vol;
        }
    }, 70);

    overlay.style.opacity = '1';

    setTimeout(() => {
        document.body.innerHTML = '';
        document.body.style.background = '#000';
    }, 2200);
}

// ESC 종료
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        clearInterval(timer);
        bgm.pause();
        overlay.style.opacity = '1';
        setTimeout(() => location.reload(), 700);
    }
});

window.addEventListener('load', start);
</script>
</body>
</html>
